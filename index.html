<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北九州 4天3夜</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden;position:relative;touch-action:none;-webkit-tap-highlight-color:transparent}.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}.leaflet-pane{z-index:400}.leaflet-zoom-animated{transform-origin:0 0}.leaflet-marker-icon{display:block}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px;background:#fff}.leaflet-popup-content{margin:13px 24px 13px 20px;line-height:1.3}.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:#fff}.leaflet-popup-close-button{position:absolute;top:0;right:0;padding:4px 8px 0 0;font:16px/24px sans-serif;color:#757575;text-decoration:none}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}.leaflet-control{position:relative;z-index:800;float:left;clear:both;pointer-events:auto;margin:10px}.leaflet-right .leaflet-control{float:right}.leaflet-control-attribution{background:rgba(255,255,255,.8);padding:0 5px;font-size:11px;margin:0}.leaflet-bar{border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.4)}.leaflet-bar a{display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;background:#fff;color:#000;border-bottom:1px solid #ccc}
:root{--bg:#FFFCF6;--ink:#3E3A39;--pink:#F2A497;--yel:#F6D27A;--blue:#A8D3E6;--green:#B9DAA5;--pur:#8E6BBF;box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Huninn','Hiragino Maru Gothic ProN','PingFang TC','Noto Sans TC',sans-serif;line-height:1.6;font-size:16px}
a{color:inherit}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:3px solid var(--ink);display:flex;gap:6px;padding:8px 10px;overflow-x:auto}
nav a{flex:1 0 auto;text-align:center;text-decoration:none;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:15px;background:#fff}
nav a:nth-child(1){background:var(--pink)}nav a:nth-child(2){background:var(--blue)}nav a:nth-child(3){background:var(--yel)}nav a:nth-child(4){background:var(--green)}nav a:nth-child(5){background:var(--pink)}
main{max-width:640px;margin:0 auto;padding:16px 14px 48px}
section{margin-top:28px}
h2{font-size:22px;margin:0 0 12px;display:inline-block;background:var(--yel);border:3px solid var(--ink);border-radius:999px;padding:0 16px}
.card{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:16px}
.hero{background:var(--blue);padding:0;overflow:hidden;text-align:center}
.hero svg{display:block;width:100%;height:auto;border-bottom:3px solid var(--ink)}
.hero .tx{padding:14px 14px 18px;background:var(--bg)}
.hero h1{margin:0;font-size:30px;line-height:1.2}
.hero p{margin:4px 0 12px}
.cd{display:flex;justify-content:center;gap:8px}
.cd div{background:var(--pink);border:3px solid var(--ink);border-radius:18px;min-width:62px;padding:2px 6px}
.cd b{display:block;font-size:26px;line-height:1.3}.cd small{font-size:12px}
.flight{display:grid;gap:14px}
.fl{border:3px solid var(--ink);border-radius:22px;padding:12px 14px;background:var(--bg)}
.fl.out{background:#e9f4fa}.fl.back{background:#fdeeea}
.fl h3{margin:0 0 6px;font-size:17px}
.route{display:flex;align-items:center;justify-content:space-between;text-align:center}
.route .ap b{font-size:26px;display:block;line-height:1.1}
.route .ap small{display:block}
.route .mid{flex:1;font-size:22px;padding:0 6px}
.tm{display:flex;justify-content:space-between;margin-top:8px;font-size:15px}
.tm span{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:0 12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;font:inherit;border:3px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);padding:4px 0;line-height:1.25;cursor:pointer}
.tabs button small{display:block;font-size:12px}
.tabs button.on{background:var(--pink);transform:translateY(-3px)}
.tabs button.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-3deg)}65%{transform:scale(.94)}100%{transform:scale(1)}}
.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:18px}
.dayhead i{font-style:normal;background:#4A5258;color:#fff;border:3px solid var(--ink);border-radius:999px;padding:0 12px;font-size:14px}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px dashed var(--ink)}
.tl.bounce li{animation:rise .5s both}
.tl.bounce li:nth-child(2){animation-delay:.07s}.tl.bounce li:nth-child(3){animation-delay:.14s}.tl.bounce li:nth-child(4){animation-delay:.21s}.tl.bounce li:nth-child(5){animation-delay:.28s}.tl.bounce li:nth-child(6){animation-delay:.35s}.tl.bounce li:nth-child(7){animation-delay:.42s}
@keyframes rise{0%{opacity:0;transform:translateY(24px) scale(.9)}60%{opacity:1;transform:translateY(-6px) scale(1.03)}100%{transform:none}}
.tl li{position:relative;margin-bottom:14px}
.tl li::before{content:"";position:absolute;left:-34px;top:10px;width:16px;height:16px;border-radius:50%;background:var(--yel);border:3px solid var(--ink)}
.tl li.must::before{background:var(--pink)}
.stop{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 12px}
.stop b{font-size:17px}
.stop p{margin:2px 0 0;font-size:14px}
.tl li.stay .stop{background:var(--pur);color:#fff}.tl li.stay::before{display:none}.tl li.stay .btn{color:var(--ink)}
.stay-label{font-size:13px;margin-bottom:2px}
.tag{display:inline-block;font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:0 9px;margin:0 4px 4px 0;line-height:1.5}
.bus{background:var(--pink)}.train{background:var(--yel)}.boat{background:var(--blue)}.walk{background:var(--green)}.plane,.st{background:#fff}.taxi{background:var(--yel)}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fl-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.fl-head h2{margin:0}
.bag{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:0 14px;font-size:14px;line-height:1.7}
.cat{display:inline-block;font-size:11px;background:var(--pur);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 7px;margin-right:5px;line-height:1.4}
.pl{display:block;margin:8px 0 0;font-size:15px;text-decoration:none}.pl:active{opacity:.6}
.mapcard{padding:12px}.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px}
.chips button{flex:none;font:inherit;font-size:13px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);padding:0 10px;cursor:pointer;line-height:1.6}
.chips button.on{background:var(--pur);color:#fff}
#gmap{display:block;width:100%;height:320px;border:3px solid var(--ink);border-radius:20px;background:var(--blue)}
#dmap{height:260px;border:3px solid var(--ink);border-radius:20px;margin-bottom:14px;overflow:hidden;background:var(--blue);z-index:0;font-family:inherit}
#dmap .leaflet-tile-pane{filter:sepia(.18) saturate(.9)}
#dmap .leaflet-popup-content-wrapper{border:3px solid var(--ink);border-radius:16px;box-shadow:none}
#dmap .leaflet-popup-content{margin:8px 12px;font:14px/1.5 inherit}#dmap .leaflet-popup-content a{color:var(--pur)}
.pin{background:none;border:0}
.grp+.grp{border-top:3px dashed var(--ink);margin-top:12px;padding-top:12px}
.must-badge{float:right;background:var(--pink);border:2px solid var(--ink);border-radius:999px;font-size:12px;padding:0 8px;transform:rotate(4deg)}
.via{font-size:13px;margin:-6px 0 10px;padding-left:2px}
.todo{list-style:none;margin:0;padding:0}
.todo li{margin-bottom:8px}
.todo label{display:flex;gap:10px;align-items:center;cursor:pointer;border:3px solid var(--ink);border-radius:18px;padding:6px 12px;background:var(--bg)}
.todo input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border:3px solid var(--ink);border-radius:8px;background:#fff;margin:0;display:grid;place-content:center}
.todo input:checked{background:var(--green)}
.todo input:checked::after{content:"✓";font-size:17px;line-height:1}
.todo input:checked+span{text-decoration:line-through;opacity:.55}
.prog{height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin-bottom:12px}
.prog div{height:100%;width:0;background:var(--green);transition:width .4s}
.hotel{margin-bottom:12px;border-radius:22px}
.hotel h3{margin:0}
.btn{display:inline-block;text-decoration:none;border:3px solid var(--ink);border-radius:999px;padding:0 14px;margin:6px 6px 0 0;font-size:14px;background:#fff}
.btn.b,.btn.p{background:#fff}
.sub{font-size:17px;margin:16px 0 6px}
.cloud{animation:drift 14s ease-in-out infinite alternate}.cloud2{animation-duration:19s;animation-direction:alternate-reverse}
.boat-g{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sun{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
.wave{animation:drift 5s ease-in-out infinite alternate}
.bird{animation:bob 2.4s ease-in-out infinite}
@keyframes drift{to{transform:translateX(26px)}}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;font-size:13px;margin-top:30px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div class="tx"><h1>北九州<br>4天3夜小旅行</h1><p>10/15 (四) – 10/18 (日)・小倉・門司港・下關</p>
